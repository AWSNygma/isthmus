name: Game report
description: A game doesn't work (or works and needs a recipe)
labels: [game]
body:
  - type: input
    id: game
    attributes: { label: Game, description: "Name and store link (Steam/Epic/GOG)" }
    validations: { required: true }
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Works perfectly, Works with tweaks, Starts but has problems, Doesn't start]
    validations: { required: true }
  - type: input
    id: mac
    attributes: { label: Mac, description: "e.g. MacBook Pro M3 Pro 18 GB, macOS 26.1" }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Isthmus and engine versions, description: "Engines & Graphics page shows both" }
    validations: { required: true }
  - type: dropdown
    id: backend
    attributes: { label: Graphics backend, options: [Automatic, D3DMetal, DXMT, DXVK, Wine built-in] }
  - type: textarea
    id: details
    attributes: { label: What happened, description: "Settings you changed, what you saw" }
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Library → right-click the game → Show Latest Log. Paste the first 40 and last 100 lines.
      render: text
